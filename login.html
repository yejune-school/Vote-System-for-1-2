<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>로그인 - 탄핵 투표</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="login-page">

  <div class="login-box">

    <h1>
      1-2 부반장 최지혁
    </h1>

    <h2>
      탄핵 투표
    </h2>

    <p>
      투표하려면 로그인해주세요.
    </p>


    <button
      id="googleLogin"
      class="login-button google">
      Google로 로그인
    </button>


    <button
      id="kakaoLogin"
      class="login-button kakao">
      카카오로 로그인
    </button>

  </div>

</main>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="app.js"></script>

</body>
</html>
