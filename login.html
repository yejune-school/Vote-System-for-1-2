<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — VOTE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center-page">
  <main class="login-card">
    <span class="badge">ONLINE VOTING</span>
    <h1>VOTE</h1>
    <p>투표하려면 Google 계정으로 로그인하세요.</p>
    <button id="googleLogin" class="google-btn">
      <span>G</span> Google로 계속하기
    </button>
    <a href="index.html" class="back">← 돌아가기</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const client = supabase.createClient(
      window.VOTE_CONFIG.SUPABASE_URL,
      window.VOTE_CONFIG.SUPABASE_ANON_KEY
    );

    function getRedirectUrl(filename) {
      const path = window.location.pathname;
      const base = path.endsWith("/")
        ? path
        : path.replace(/\/[^/]*$/, "/");
      return window.location.origin + base + (filename || "index.html");
    }

    if (window.location.hash && /access_token|refresh_token/.test(window.location.hash)) {
      window.history.replaceState({}, document.title, window.location.pathname);
      location.href = "index.html";
    }

    document.getElementById("googleLogin").addEventListener("click", async () => {
      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: getRedirectUrl("index.html") }
      });
      if (error) alert(error.message);
    });
  </script>
</body>
</html>
