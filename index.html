<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>1-2 부반장 최지혁 탄핵 투표</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>1-2 부반장 최지혁 탄핵 투표</h1>

  <div class="user-area">
    <span id="userName"></span>
    <button id="logoutButton">
      로그아웃
    </button>
  </div>
</header>


<main>

  <section class="hero">

    <h2>
      1-2 부반장 최지혁 탄핵 투표
    </h2>

    <p>
      최지혁 학생의 1-2 부반장 탄핵에 대한 투표입니다.
    </p>

    <p id="status">
      투표 상태 확인 중...
    </p>

  </section>


  <section class="vote-box">

    <button
      class="vote-button agree"
      data-choice="찬성">
      찬성
    </button>

    <button
      class="vote-button disagree"
      data-choice="반대">
      반대
    </button>

    <button
      class="vote-button abstain"
      data-choice="기권">
      기권
    </button>

  </section>


  <section
    id="adminButton"
    class="admin-panel hidden">

    <h2>관리자</h2>

    <button id="resultButton">
      투표 결과 보기
    </button>

    <button id="resetButton">
      투표 초기화
    </button>

  </section>


  <section
    id="result"
    class="result hidden">
  </section>

</main>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="app.js"></script>

</body>
</html>
