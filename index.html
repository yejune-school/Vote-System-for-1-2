<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote — 투표</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">VOTE</a>
    <div class="account">
      <span id="userName"></span>
      <button id="loginBtn" class="ghost">Google 로그인</button>
      <button id="logoutBtn" class="ghost hidden">로그아웃</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <span class="badge">ONLINE VOTING</span>
      <h1>투표에 참여하세요.</h1>
      <p>Google 계정으로 로그인한 뒤 한 사람당 한 번만 투표할 수 있습니다.</p>
    </section>

    <section id="loginNotice" class="card notice">
      <h2>로그인이 필요합니다</h2>
      <p>투표하려면 Google 계정으로 로그인해주세요.</p>
      <button id="loginBtn2" class="primary">Google로 로그인</button>
    </section>

    <section id="voteSection" class="hidden">
      <div class="section-head">
        <div>
          <h2>후보 선택</h2>
          <p id="voteStatus">한 사람당 한 표입니다.</p>
        </div>
      </div>
      <div id="candidateList" class="candidate-grid"></div>
    </section>

    <section class="result-link">
      <a href="result.html">현재 투표 결과 보기 →</a>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
