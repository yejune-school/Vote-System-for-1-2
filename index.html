<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOTE — 투표</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html">VOTE</a>
  <div class="account">
    <span id="userName"></span>
    <a id="adminLink" href="admin.html" class="ghost hidden">관리자</a>
    <a href="result.html" class="ghost">결과</a>
    <button id="logoutBtn" class="ghost hidden">로그아웃</button>
  </div>
</header>

<main class="container">
  <section class="hero">
    <span class="badge">ONLINE VOTING</span>
    <h1 id="heroTitle">투표에 참여하세요.</h1>
    <p id="heroDesc">찬성, 반대, 기권 중 하나를 선택할 수 있습니다.</p>
  </section>

  <section id="loginNotice" class="card notice hidden">
    <h2>로그인이 필요합니다</h2>
    <p>투표하려면 Google 계정으로 로그인하세요.</p>
    <button id="loginBtn" class="primary">Google로 로그인</button>
  </section>

  <section id="voteSection" class="hidden">
    <div class="section-head">
      <h2>투표 선택</h2>
      <p id="voteStatus">한 사람당 한 표입니다.</p>
    </div>
    <div id="candidateList" class="candidate-grid"></div>
    <div class="result-link">
      <a href="result.html">투표 결과 보기 →</a>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
