<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 · 1-2 VOTE</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-orb orb-a"></div><div class="bg-orb orb-b"></div>
<header class="topbar">
  <a class="brand" href="./"><span class="brand-mark">V</span><span>1-2 VOTE</span></a>
  <div class="top-actions"><a class="text-btn" href="./">투표 화면</a><button id="logoutButton" class="text-btn">로그아웃</button></div>
</header>
<main class="container admin-container">
  <div class="page-title"><div class="eyebrow">ADMIN DASHBOARD</div><h1>투표 관리</h1><p>투표 제목과 설명, 상태 및 결과를 관리합니다.</p></div>

  <section class="admin-grid">
    <div class="panel settings-panel">
      <div class="panel-head"><div><span class="label">CONTENT</span><h2>투표 내용</h2></div></div>
      <label>제목<input id="settingTitle" type="text" maxlength="100"></label>
      <label>설명<textarea id="settingDescription" rows="5" maxlength="300"></textarea></label>
      <label class="switch-row"><span><b>투표 상태</b><small>끄면 일반 사용자는 투표할 수 없습니다.</small></span><input id="isOpen" type="checkbox"><i></i></label>
      <button id="saveSettings" class="primary-btn">변경사항 저장</button>
    </div>

    <div class="panel results-panel">
      <div class="panel-head"><div><span class="label">RESULT</span><h2>현재 결과</h2></div><span id="totalCount" class="total-pill">0명</span></div>
      <div class="bar-row"><div><span>찬성</span><b id="agreeCount">0</b></div><div class="bar"><i id="agreeBar"></i></div></div>
      <div class="bar-row"><div><span>반대</span><b id="disagreeCount">0</b></div><div class="bar"><i id="disagreeBar"></i></div></div>
      <div class="bar-row"><div><span>기권</span><b id="abstainCount">0</b></div><div class="bar"><i id="abstainBar"></i></div></div>
    </div>
  </section>

  <section class="panel danger-panel">
    <div><span class="label">DANGER ZONE</span><h2>투표 데이터 초기화</h2><p>모든 투표 기록을 삭제합니다. 삭제 후에는 복구할 수 없습니다.</p></div>
    <button id="resetVotes" class="danger-btn">전체 투표 초기화</button>
  </section>
</main>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="admin.js"></script>
</body>
</html>
